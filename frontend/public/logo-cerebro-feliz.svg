<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Cerebro feliz fortalecido">
  <defs>
    <linearGradient id="goldG" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFD66B"/>
      <stop offset="60%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#F9A826"/>
    </linearGradient>
    <linearGradient id="brainG" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7f3"/>
      <stop offset="100%" stop-color="#ffeef6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- gold circular background -->
  <circle cx="110" cy="110" r="100" fill="url(#goldG)"/>

  <!-- small decorative sparkles -->
  <g fill="#fff8e6" opacity="0.7">
    <circle cx="30" cy="40" r="4"/>
    <circle cx="190" cy="60" r="3"/>
    <circle cx="160" cy="170" r="3.5"/>
  </g>

  <!-- brain group -->
  <g transform="translate(20,20)">
    <!-- left lobe -->
    <path d="M60 70c-14-6-26 0-32 12-6 12-2 28 12 36 14 8 34 6 44-6" fill="url(#brainG)" stroke="#ffd7e6" stroke-width="2"/>
    <!-- right lobe -->
    <path d="M120 70c14-6 26 0 32 12 6 12 2 28-12 36-14 8-34 6-44-6" fill="url(#brainG)" stroke="#ffd7e6" stroke-width="2"/>
    <!-- mid creases -->
    <path d="M86 58c6-8 20-10 34-4" stroke="#ffd0e0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M70 92c-8 6-6 20 8 26" stroke="#ffd0e0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M124 92c8 6 6 20-8 26" stroke="#ffd0e0" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- happy face: eyes + smile -->
    <g transform="translate(0,6)">
      <circle cx="82" cy="90" r="5" fill="#4b5563"/>
      <circle cx="108" cy="90" r="5" fill="#4b5563"/>
      <path d="M78 104c6 8 18 8 26 0" stroke="#374151" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- shield (strength) on right, slightly overlapping brain -->
  <g transform="translate(140,86)">
    <path d="M30 0 L60 12 V34 C60 54 42 74 30 80 C18 74 0 54 0 34 V12 Z" fill="#ffefc4" stroke="#f4c150" stroke-width="2"/>
    <path d="M30 8 L44 14 L30 26 L16 14 Z" fill="#ffd66b" opacity="0.9"/>
    <!-- small check mark / badge to indicate strength -->
    <path d="M22 36 L28 42 L40 24" stroke="#b06e00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

</svg>